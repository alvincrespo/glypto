name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run type checking
        run: npx tsc --noEmit

      - name: Build project
        run: npm run build

      - name: Run tests
        run: npm run test:coverage

      - name: Upload coverage reports as artifact
        if: matrix.node-version == '24.x'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: coverage/

  format-check:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npx prettier --check "src/**/*.ts" "test/**/*.ts"

  lockfile-guard:
    name: Lockfile Guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for stripped libc metadata
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # npm < 11.11.0 silently deletes "libc" entries from the lockfile.
          # npm needs them to pick the right prebuilt native binary on musl vs
          # glibc, so losing them is a real regression that reads as diff noise.
          # See docs/dependencies.md.
          git fetch --no-tags --depth=1 origin "$BASE_REF"

          base=$(git show "FETCH_HEAD:package-lock.json" | grep -c '"libc"' || true)
          head=$(grep -c '"libc"' package-lock.json || true)
          echo "libc entries — base: $base, head: $head"

          if [ "$head" -lt "$base" ]; then
            echo "::error file=package-lock.json::package-lock.json lost $((base - head)) \"libc\" entries. Regenerate with Node 24.14.1+ (npm 11.11.0+): git checkout package-lock.json && nvm use && npm install --package-lock-only. If you intentionally removed a dependency that carried libc metadata, say so in the PR description."
            exit 1
          fi

          echo "No libc metadata lost."

  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run security audit
        run: npm audit --audit-level moderate

      - name: Run dependency check
        run: npx depcheck --ignores="@types/*,tsx,prettier,@vitest/coverage-v8"
